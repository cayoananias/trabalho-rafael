<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <!-- Título atualizado para Cadastro -->
  <title>HamsterHouse – Cadastro</title> 
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- Scripts de inicialização (adapte 'cadastro.html' ao nome da página) -->
<script src="auth.js"></script>
<script>
    checkAuth(); 
    renderNavbar('criar.html'); // Altera o parâmetro para a nova página
</script>

<div class="page-header">
  <h1>Criar Conta</h1>
  <p>Faça seu cadastro e garanta um ambiente seguro para você e seu hamster.</p>
</div>

<!-- Conteúdo Principal do Formulário -->
<div class="container form-wrapper"> 
    <form id="registrationForm">
        
        <!-- Nome Completo -->
        <div class="field" id="f_name">
            <label for="nome">Nome Completo *</label>
            <input type="text" id="nome" placeholder="Ex: João da Silva" required>
            <span class="err name-err" style="display: none;">Por favor, preencha seu nome completo.</span>
        </div>

        <!-- E-mail -->
        <div class="field" id="f_email">
            <label for="email">E-mail *</label>
            <input type="email" id="email" placeholder="seu@email.com" required>
            <span class="err email-err" style="display: none;">Insira um e-mail válido.</span>
        </div>

        <!-- Senha -->
        <div class="field" id="f_password">
            <label for="senha">Senha *</label>
            <input type="password" id="senha" placeholder="Mínimo 6 caracteres" required minlength="6">
            <span class="err password-err" style="display: none;">A senha deve ter no mínimo 6 caracteres.</span>
        </div>

        <!-- Confirmação de Senha -->
        <div class="field" id="f_confirm-password">
            <label for="confsenha">Confirme a Senha *</label>
            <input type="password" id="confsenha" placeholder="Repita sua senha" required>
             <span class="err confirm-password-err" style="display: none;">As senhas não coincidem.</span>
        </div>

        <!-- Botão de envio -->
        <button type="submit" class="btn-submit">Criar Conta 🐹</button>
        
        <!-- Mensagem de Sucesso/Erro (Inicialmente escondido) -->
        <div class="success-box" id="registrationSuccessBox" style="display: none;">✅ Cadastro realizado com sucesso! Você será redirecionado para a área logada.</div>
    </form>

</div> 

<!-- O script JS deve ser colocado no final do body ou em um arquivo externo -->
<script src="./scripts/cadastro.js"></script>
</body>
</html>
