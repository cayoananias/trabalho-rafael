<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HamsterHouse – Produtos</title>
  <link rel="stylesheet" href="Style/style.css"/>
  <style>
    .filter-bar {
      display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 32px; align-items: center;
    }
    .filter-btn {
      padding: 8px 18px; border: 2px solid var(--border);
      border-radius: 20px; background: var(--card);
      color: var(--text); font-size: .88rem; font-weight: 500;
      cursor: pointer; transition: all .15s;
    }
    .filter-btn.active, .filter-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .search-input {
      padding: 9px 16px; border: 2px solid var(--border);
      border-radius: 20px; background: var(--card); color: var(--text);
      font-size: .9rem; outline: none; min-width: 200px; transition: border-color .2s;
    }
    .search-input:focus { border-color: var(--accent); }
    .no-results { text-align:center; padding: 60px 20px; color: var(--muted); font-size:1.1rem; }
  </style>
</head>
<body>
<script src="Script/auth.js"></script>
<script>checkAuth(); renderNavbar('produtos.html');</script>

<div class="page-header">
  <h1>🏡 Nossas Gaiolas</h1>
  <p>Encontre o lar perfeito para seu hamster</p>
</div>

<div class="section">
  <div class="filter-bar">
    <input class="search-input" type="text" id="searchInput" placeholder="🔍 Buscar produto..."/>
    <button class="filter-btn active" data-cat="todos">Todos</button>
    <button class="filter-btn" data-cat="basico">Básico</button>
    <button class="filter-btn" data-cat="premium">Premium</button>
    <button class="filter-btn" data-cat="acessorios">Acessórios</button>
  </div>

  <div class="grid-3" id="productGrid"></div>
  <div class="no-results" id="noResults" style="display:none">Nenhum produto encontrado 🐹</div>
</div>

<footer>
  <div class="footer-grid">
    <div class="footer-col"><h4>🐹 HamsterHouse</h4><p>Especialistas em gaiolas para hamsters.</p></div>
    <div class="footer-col"><h4>Links</h4><a href="index.html">Início</a><a href="produtos.html">Produtos</a><a href="sobre.html">Sobre</a><a href="contato.html">Contato</a></div>
    <div class="footer-col"><h4>Contato</h4><p>📧 contato@hamsterhouse.com.br<br>📞 (11) 91234-5678</p></div>
  </div>
  <div class="footer-bottom">© 2025 HamsterHouse. Todos os direitos reservados.</div>
</footer>

<script>
const products = [
  { name: 'Gaiola Confort Plus', price: 129.90, cat: 'basico', emoji: '🏡', badge: 'Mais vendido', desc: 'Espaçosa, 2 andares, roda de exercício inclusa.' },
  { name: 'Gaiola Nature', price: 179.90, cat: 'premium', emoji: '🌿', badge: 'Novo', desc: 'Estilo rústico com madeira e grade metálica.' },
  { name: 'Mini Gaiola Fun', price: 79.90, cat: 'basico', emoji: '🎡', badge: 'Oferta', desc: 'Compacta e colorida, ideal para espaços menores.' },
  { name: 'Gaiola Tower Pro', price: 239.90, cat: 'premium', emoji: '🗼', badge: 'Premium', desc: 'Torre modular com 3 andares e múltiplos acessórios.' },
  { name: 'Gaiola Crystal', price: 199.90, cat: 'premium', emoji: '💎', badge: 'Premium', desc: 'Estrutura acrílica transparente, visual incrível.' },
  { name: 'Roda Silenciosa', price: 34.90, cat: 'acessorios', emoji: '⚙️', badge: 'Acessório', desc: 'Roda de exercício ultra-silenciosa, 28cm.' },
  { name: 'Bebedouro Automático', price: 24.90, cat: 'acessorios', emoji: '💧', badge: 'Acessório', desc: 'Sistema antigotejamento com válvula de aço.' },
  { name: 'Gaiola Starter', price: 59.90, cat: 'basico', emoji: '🏠', badge: 'Econômico', desc: 'Perfeita para quem está começando. Simples e funcional.' },
  { name: 'Ponte de Madeira', price: 19.90, cat: 'acessorios', emoji: '🪵', badge: 'Acessório', desc: 'Enriquecimento ambiental natural para o habitat.' },
];

const bgs = [
  'linear-gradient(135deg,#fde8d0,#fbc97a)',
  'linear-gradient(135deg,#d0eedf,#78c9a2)',
  'linear-gradient(135deg,#d5d0f5,#9b91e8)',
  'linear-gradient(135deg,#fde8d0,#fbc97a)',
  'linear-gradient(135deg,#f0d5f5,#c891e8)',
  'linear-gradient(135deg,#d0e8f5,#78b9e2)',
  'linear-gradient(135deg,#d0eedf,#78c9a2)',
  'linear-gradient(135deg,#fde8d0,#fbc97a)',
  'linear-gradient(135deg,#f5e4d0,#e8b878)',
];

let currentCat = 'todos';
let searchTerm = '';

function render() {
  const grid = document.getElementById('productGrid');
  const noR = document.getElementById('noResults');
  const filtered = products.filter(p => {
    const matchCat = currentCat === 'todos' || p.cat === currentCat;
    const matchSearch = p.name.toLowerCase().includes(searchTerm) || p.desc.toLowerCase().includes(searchTerm);
    return matchCat && matchSearch;
  });

  if (filtered.length === 0) {
    grid.innerHTML = '';
    noR.style.display = 'block';
    return;
  }
  noR.style.display = 'none';
  grid.innerHTML = filtered.map((p, i) => `
    <div class="product-card">
      <div class="card-img" style="background:${bgs[products.indexOf(p)]}">${p.emoji}</div>
      <div class="card-body">
        <span class="badge">${p.badge}</span>
        <div class="card-title">${p.name}</div>
        <div class="card-desc">${p.desc}</div>
        <div class="card-footer">
          <span class="price">R$ ${p.price.toFixed(2).replace('.',',')}</span>
          <button class="btn-add" onclick="addCart('${p.name}', ${p.price}, this)">Adicionar</button>
        </div>
      </div>
    </div>
  `).join('');
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = btn.dataset.cat;
    render();
  });
});

document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value.toLowerCase();
  render();
});

function addCart(name, price, btn) {
  let cart = JSON.parse(localStorage.getItem('cart') || '[]');
  const existing = cart.find(i => i.name === name);
  if (existing) existing.qty++;
  else cart.push({ name, price, qty: 1 });
  localStorage.setItem('cart', JSON.stringify(cart));
  btn.textContent = '✓ Adicionado';
  btn.style.background = '#2a7a3a';
  setTimeout(() => { btn.textContent = 'Adicionar'; btn.style.background = ''; }, 1500);
}

render();
</script>
</body>
</html>
